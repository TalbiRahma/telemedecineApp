<div *ngIf="enabled" class="mt-6 p-6 bg-gray-900 rounded-lg shadow-lg">
  <h3 class="text-lg font-semibold text-white mb-4 text-center">Two-Factor Authentication</h3>

  <p class="text-gray-300 text-sm mb-3 text-center">
    Enter the 6-digit code generated by your authenticator app
  </p>

  <input 
    id="validationCode" 
    type="text" 
    maxlength="6"
    
    placeholder="Enter code"
    class="block w-full rounded-md bg-gray-700 border border-gray-600 px-4 py-2 text-white placeholder-gray-400 
           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none sm:text-sm mb-4" 
  />

  <button 
    type="button"  
    (click)="verifyCode()"
    [disabled]="!otpCode || otpCode.length < 6"
    class="w-full rounded-md bg-indigo-500 px-4 py-2 text-sm font-semibold text-white 
           hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50">
    Verify Code
  </button>
</div>
