<!-- admin-specialties-list-page.component.html -->
<div class="p-6 bg-gray-900 min-h-screen text-white">
  <h1 class="text-2xl font-bold mb-6">Specialties Management</h1>

  <!-- Add New Button -->
  <div class="mb-4">
    <button 
      (click)="openAddModal()" 
      class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-white">
      + Add Specialty
    </button>
  </div>

  <!-- Specialties Table -->
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left border border-gray-700 rounded-lg">
      <thead class="bg-gray-800 text-gray-300">
        <tr>
          <th class="px-4 py-2">ID</th>
          <th class="px-4 py-2">Name</th>
          <th class="px-4 py-2">Description</th>
          <th class="px-4 py-2">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let specialty of specialties" class="border-b border-gray-700 hover:bg-gray-800">
          <td class="px-4 py-2">{{ specialty.id }}</td>
          <td class="px-4 py-2">{{ specialty.name }}</td>
          <td class="px-4 py-2">{{ specialty.description }}</td>
          <td class="px-4 py-2 space-x-2">
            <button 
              (click)="openEditModal(specialty)" 
              class="bg-yellow-600 hover:bg-yellow-700 px-3 py-1 rounded-lg text-white">
              Edit
            </button>
            <button 
              (click)="deleteSpecialty(specialty.id)" 
              class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded-lg text-white">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal for Add/Edit -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-lg shadow-lg w-full max-w-2xl p-6">
      <h2 class="text-2xl font-bold mb-6 text-white">
        {{ editingSpecialty ? 'Edit Specialty' : 'Add Specialty' }}
      </h2>

      <!-- Form -->
      <form (ngSubmit)="saveSpecialty()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Name</label>
          <input 
            [(ngModel)]="specialtyForm.name" 
            name="name" 
            type="text" 
            class="w-full px-3 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Description</label>
          <textarea 
            [(ngModel)]="specialtyForm.description" 
            name="description" 
            rows="3" 
            class="w-full px-3 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          ></textarea>
        </div>

        <!-- Buttons -->
        <div class="mt-6 flex justify-end space-x-3">
          <button 
            type="submit" 
            class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-white">
            Save
          </button>
          <button 
            type="button" 
            (click)="closeModal()" 
            class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg text-white">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
