<div class="flex min-h-full items-center justify-center px-6 py-12 lg:px-8">
  <div class="flex w-full max-w-5xl bg-gray-800 rounded-lg shadow-lg overflow-hidden flex-col">

    <!-- Forms Row -->
    <div class="flex w-full">

      <!-- Patient Form -->
      <div class="w-1/2 p-8">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Register as Patient</h2>
        <form class="space-y-4" (ngSubmit)="registerUser()">
          <input type="text" placeholder="First name" [(ngModel)]="registerRequest.firstname" name="firstnamePatient" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="text" placeholder="Last name" [(ngModel)]="registerRequest.lastname" name="lastnamePatient" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="email" placeholder="Email" [(ngModel)]="registerRequest.email" name="emailPatient" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="password" placeholder="Password" [(ngModel)]="registerRequest.password" name="passwordPatient" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
       
          <button type="submit" 
            class="w-full bg-indigo-500 hover:bg-indigo-400 text-white py-2 rounded-md">Register</button>
        </form>
      </div>

      <!-- Divider -->
      <div class="flex items-center justify-center w-0.5 bg-gray-600 relative">
        <span class="absolute bg-gray-800 text-gray-300 px-2 -translate-y-1/2 top-1/2 text-sm font-semibold">OR</span>
      </div>

      <!-- Doctor Form -->
      <div class="w-1/2 p-8">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Register as Doctor</h2>
        <form class="space-y-4" (ngSubmit)="registerDoctor()" enctype="multipart/form-data">
          <input type="text" placeholder="First name" [(ngModel)]="doctorRegisterRequest.firstname" name="firstnameDoctor" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="text" placeholder="Last name" [(ngModel)]="doctorRegisterRequest.lastname" name="lastnameDoctor" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="text" placeholder="License Number" [(ngModel)]="doctorRegisterRequest.licenseNumber" name="licenseNumberDoctor" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="email" placeholder="Email" [(ngModel)]="doctorRegisterRequest.email" name="emailDoctor" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
          <input type="password" placeholder="Password" [(ngModel)]="doctorRegisterRequest.password" name="passwordDoctor" required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500" />
            
          <div>
            <label class="block text-white mb-1" for="licenseFile">Upload License / Certification</label>
            <input type="file" id="licenseFile" #licenseFileInput (change)="onFileSelected($event)" name="licenseFile"
        class="w-full text-white bg-gray-700 px-3 py-2 rounded-md focus:outline-indigo-500" />
          </div>
          
          <div>
            <label class="block text-white mb-1" for="licenseFile">Select Specialty</label>

             <!-- Loading state -->
            <div *ngIf="isLoading" class="text-white">Loading specialties...</div>

              <!-- Error state -->
            <div *ngIf="errorMessage" class="text-red-500 mb-2">{{ errorMessage }}</div>

            <!-- Success state -->
          <select  
            *ngIf="!isLoading && !errorMessage"
            [(ngModel)]="doctorRegisterRequest.specialtyId" 
            name="specialty" 
            required
            class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500">
            
            <option value="" disabled selected>Select Specialty</option>
            <option *ngFor="let specialty of specialties" [value]="specialty.id">
              {{ specialty.name }}
            </option>
            
          </select>
          </div>
          
          <button type="submit" 
            class="w-full bg-indigo-500 hover:bg-indigo-400 text-white py-2 rounded-md">Register</button>
        </form>
      </div>
    </div>

    <!-- 2FA Checkbox below forms -->
    <div class="p-4 bg-gray-700 border-t border-gray-600 mt-4 flex items-center justify-center space-x-2">
      <input 
      id="globalMfa" 
      type="checkbox" [(ngModel)]="registerRequest.mfaEnabled" 
      name="mfaEnabled"
      class="h-4 w-4 text-indigo-500" />
      <label for="globalMfa" class="text-white text-sm font-medium">Enable 2FA (Two-Factor Authentication)</label>
    </div>

  </div>
</div>
