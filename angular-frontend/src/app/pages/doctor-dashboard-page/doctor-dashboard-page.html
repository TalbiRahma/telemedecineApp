<div class="doctor-shell">
  <div class="mobile-backdrop" [class.visible]="menuOpen" (click)="toggleMenu()"></div>
  <aside class="doctor-sidebar" [class.open]="menuOpen" aria-label="Doctor navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><span class="material-icons-outlined">add</span></span><span class="brand-copy"><strong>Medi<span>Link</span></strong><small>Doctor portal</small></span><button class="mobile-close" type="button" aria-label="Close menu" (click)="toggleMenu()"><span class="material-icons-outlined">close</span></button></div>
    <p class="nav-label">Doctor workspace</p>
    <nav class="doctor-nav"><a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span class="material-icons-outlined">{{ item.icon }}</span><span>{{ item.label }}</span></a></nav>
    <div class="sidebar-bottom"><div class="support-card"><span class="material-icons-outlined">event_available</span><strong>Care starts with your schedule</strong><p>Manage appointments and availability efficiently.</p></div><button class="logout-button" type="button" (click)="onLogout()"><span class="material-icons-outlined">logout</span>Logout</button></div>
  </aside>
  <main class="doctor-workspace">
    <header class="workspace-header"><button class="menu-button" type="button" aria-label="Open menu" (click)="toggleMenu()"><span class="material-icons-outlined">menu</span></button><span class="mobile-page-title">{{ currentPageTitle }}</span><div class="header-actions"><button class="notification-button" type="button" aria-label="Notifications"><span class="material-icons-outlined">notifications_none</span></button><div class="doctor-identity"><span class="doctor-avatar">{{ doctorInitials }}</span><span class="doctor-copy"><strong>{{ doctorDisplayName }}</strong><small>{{ doctorSpecialty }}</small></span><span class="material-icons-outlined chevron">expand_more</span></div></div></header>
    <section class="workspace-content"><router-outlet></router-outlet></section>
  </main>
</div>
