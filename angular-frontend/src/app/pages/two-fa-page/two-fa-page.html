<div class="flex min-h-full items-center justify-center px-6 py-12 lg:px-8">
  <div class="w-full max-w-lg bg-gray-800 rounded-lg shadow-lg overflow-hidden p-8 flex flex-col items-center">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-white text-center mb-6">
      Set Up Two-Factor Authentication
    </h2>

    <!-- QR Code -->
    <div class="mb-6 flex justify-center">
      <img [src]="secretImageUri" alt="QR Code" class="w-48 h-48 border border-gray-600 rounded-md shadow-md">

    </div>

    <!-- Validation Code Input -->
    <div class="w-full mb-6">
      <label for="validationCode" class="block text-white mb-2 text-sm font-medium">
        Enter 6-digit Validation Code Generated by the App
      </label>
      <input
        type="text"
        id="validationCode"
        name="validationCode"
        [(ngModel)]="otpCode"
        maxlength="6"
        required
        class="w-full px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-indigo-500"
      >
    </div>

    <!-- Verify Button -->
    <button
      type="button"
      (click)="verifyCode()"
      [disabled]="otpCode?.length < 6"
      class="w-full bg-indigo-500 hover:bg-indigo-400 text-white py-2 rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Verify Code
    </button>

  </div>
</div>
