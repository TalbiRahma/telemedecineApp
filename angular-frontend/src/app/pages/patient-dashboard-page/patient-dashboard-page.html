<div class="min-h-full">
  <!-- Navbar -->
  <nav class="bg-gray-800">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center">
          <div class="shrink-0">
            <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" 
                 alt="Clinic Logo" class="h-8 w-8"/>
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a routerLink="/patient/appointments" routerLinkActive="bg-gray-900 text-white" 
                 class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">
                Appointments
              </a>
              <a routerLink="/patient/prescriptions" routerLinkActive="bg-gray-900 text-white" 
                 class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">
                Prescriptions
              </a>
              <a routerLink="/patient/profile" routerLinkActive="bg-gray-900 text-white" 
                 class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">
                Profile
              </a>
            </div>
          </div>
        </div>

        <!-- Profile dropdown -->
        <div class="hidden md:block">
          <div class="ml-4 flex items-center md:ml-6">
            <el-dropdown>
              <button class="flex items-center rounded-full focus:outline-none">
                <img src="https://i.pravatar.cc/40" alt="profile" class="h-8 w-8 rounded-full"/>
              </button>
              <el-menu anchor="bottom end" popover class="w-48 rounded-md bg-white py-1 shadow-lg">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700">Profile</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700">Settings</a>
                <button (click)="onLogout()" class="w-full text-left px-4 py-2 text-sm text-gray-700">
                  Logout
                </button>
              </el-menu>
            </el-dropdown>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">{{ getPageTitle() }}</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
